version: '3.8'

services:
  automation-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: automation-dashboard
    restart: unless-stopped
    ports:
      - "3000:80"  # Adjust port if needed (3000 for dashboard, n8n can use different port)
    volumes:
      # Optional: Mount dist folder if you want to update without rebuilding
      - ./dist:/usr/share/nginx/html:ro
    networks:
      - automation-network

networks:
  automation-network:
    driver: bridge

